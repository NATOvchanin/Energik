
# ===== ДОБАВИТЬ В КОНЕЦ config.toml =====

[brain]
model = "gemma4:e4b"     # запасной вариант: "qwen3.5:4b" (ollama list покажет, что скачано)
num_ctx = 4096           # память разговора в токенах (больше = больше видеопамяти)
temperature = 0.8        # «творчество» (0.5 спокойнее, 1.0 безбашеннее)
max_tokens = 150         # потолок длины ответа
history_turns = 8        # сколько последних обменов репликами помнит
keep_alive = "30m"       # сколько держать модель в видеопамяти без дела
persona_file = "persona.txt"
